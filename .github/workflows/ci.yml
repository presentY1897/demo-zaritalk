name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # build/typecheck는 DB 접속 없이 Prisma generate만 필요 — 형식만 맞는 더미 URL
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Seed dry-check (schema drift)
        run: pnpm --filter @zari/db exec prisma validate

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zari
          POSTGRES_PASSWORD: zari
          POSTGRES_DB: zari
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: "postgresql://zari:zari@localhost:5432/zari"
      TEST_DATABASE_URL: "postgresql://zari:zari@localhost:5432/zari_test"
      # 토스 결제위젯(T2.1·T2.2) E2E 는 클라이언트 키가 없으면 위젯이 초기화되지 않아 실패한다.
      # 아래 두 값은 토스 **문서에 공개된 체험용 키**라 시크릿이 아니다 — 계정에도 묶이지 않는다.
      # 자기 계정 키로 바꿀 때는 GitHub Secrets 로 옮겨야 한다.
      NEXT_PUBLIC_TOSS_CLIENT_KEY: "test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm"
      TOSS_SECRET_KEY: "test_gsk_docs_OaPz8L5KdmQXkzRz3y47BMw6"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 코드젠 산출물(prisma client · panda styled-system)은 gitignore 라 체크아웃에 없다.
      # check job 의 `pnpm build` 가 만들지만 job 간 파일은 공유되지 않으므로 여기서 다시 만든다.
      - name: Generate clients (prisma + panda)
        run: pnpm codegen

      - name: Prepare test database
        run: pnpm test:db

      - name: Unit / API tests
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
